<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="logolink">
        <img src="img/favicon.png" alt="MyEvidence logo" class="logo" />
      </a>

      <button type="button" id="dark-mode-knop" aria-label="Schakel dark mode">
        <i class="bi bi-moon-fill"></i>
      </button>

      <nav class="nav">
        <ul>
          <li><a class="whoami-button" href="whoamipagina.html">WhoamI?</a></li>
          <li><a class="blog-button" href="blog.html">Blog</a></li>
          <li><a class="projecten-button" href="projecten.html">Projecten</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Contact</h1>
      <section class="contact-card">
      <form id="contact-formulier" novalidate>
        <label for="naam">Naam:</label>
        <input type="text" id="naam" name="naam">
        <p class="foutmelding" id="naam-fout" aria-live="polite"></p>

        <label for="email">E-mailadres:</label>
        <input type="text" id="email" name="email">
        <p class="foutmelding" id="email-fout" aria-live="polite"></p>

        <label for="bericht">Bericht:</label>
        <textarea id="bericht" name="bericht" rows="5"></textarea>
        <p class="foutmelding" id="bericht-fout" aria-live="polite"></p>

        <button class="verstuur-button" type="submit">Verstuur</button>
        <p id="bevestiging" aria-live="polite"></p>
      </form>
      </section>
    </main>

    <footer>
      <a class="footer-link" href="https://outlook.cloud.microsoft/mail/inbox/id/AAQkADkzZmZiNGY4LWNjYjYtNDgzYS1iMDYwLTNhN2I0MjM3MDZkZQAQANmeMzrsHEbrlJvYaGjMoA0%3D?deeplink=mail%2F0%2F%3Fnlp%3D0">
        <i class="bi bi-envelope-at-fill footer-icon"></i>klik hier om naar mijn schoolmail te gaan.
      </a>
    </footer>
  </body>
</html>
